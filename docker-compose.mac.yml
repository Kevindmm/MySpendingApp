# Docker Compose for Mac (Apple Silicon M1/M2)
# Usage: docker-compose -f docker-compose.mac.yml up --build

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.mac  # Dockerfile específico para Mac
    container_name: mySpendingApp-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./client
    container_name: mySpendingApp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

